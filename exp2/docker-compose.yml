services:
  web:
    container_name: myapp-web
    build:
      context: ./web
      dockerfile: Dockerfile
    # image: node:25
    # working_dir: /app/web
    volumes:
      - ./web:/app/web
    ports:
      - 5000:5173
    # command: ["npm", "run", "dev", "--", "--host"]
  db:
    container_name: myapp-db
    image: postgres:17
    ports:
      - "1200:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=default
    volumes:
      - ./db:/var/lib/postgresql/data